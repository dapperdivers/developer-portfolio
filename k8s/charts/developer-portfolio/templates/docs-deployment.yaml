{{- if .Values.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.docs.name }}
  labels:
    app: {{ .Values.docs.name }}
    chart: {{ include "developer-portfolio.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.docs.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.docs.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.docs.name }}
        release: {{ .Release.Name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "developer-portfolio.serviceAccountName" . }}
      containers:
        - name: {{ .Values.docs.name }}
          image: "{{ .Values.global.registry }}/{{ .Values.docs.image.repository }}:{{ .Values.docs.image.tag }}"
          imagePullPolicy: {{ .Values.docs.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.docs.service.targetPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.docs.env | nindent 12 }}
          {{- if .Values.docs.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.docs.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.docs.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.docs.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.docs.healthCheck.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.docs.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.docs.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.docs.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.docs.healthCheck.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
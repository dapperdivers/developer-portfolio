name: Blog builder

# The blog is built in the cluster from pushed articles (blog/scripts/publish.ts) and made
# live from the private blog desk (blog/desk/). This workflow tests both and publishes two
# images from blog/Dockerfile: ghcr.io/<repo>-blog (builder) and ghcr.io/<repo>-blog-desk.
# It runs when the blog or the portfolio source it imports (tokens, components, links) changes.
on:
  push:
    branches: [master]
    paths:
      - blog/**
      - src/**
      - .github/workflows/blog.yml
  pull_request:
    paths:
      - blog/**
      - src/**
      - .github/workflows/blog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test the blog builder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: blog/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Publish script and desk tests
        run: yarn test

      - name: Type check
        run: yarn typecheck
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Build the sample articles
        run: yarn build:fixtures
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  image:
    name: Publish the ${{ matrix.target }} image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: builder
            image: blog
            description: Builds the blog from pushed articles and switches the live site atomically. Never reads the vault.
          - target: desk
            image: blog-desk
            description: Private blog desk - previews vault drafts with the real build and pushes them to the blog. Runs behind SSO.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=derekmackley.com/blog ${{ matrix.target }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: blog/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=blog-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=blog-${{ matrix.target }}

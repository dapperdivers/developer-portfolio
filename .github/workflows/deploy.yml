name: Publish Docker Image to GitHub Container Registry

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # For OIDC attestations
  attestations: write  # For attestations

jobs:
  deploy:
    name: Publish Docker Image to GitHub Container Registry
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No longer need Node.js/Ruby setup - builds are handled in Docker multi-stage
      - name: Validate Docker build environment
        run: |
          echo "Docker build environment ready - using optimized 3-builder architecture"
          echo "✅ React Portfolio Builder: Node.js 22 Alpine"
          echo "✅ Storybook Component Library Builder: Node.js 22 Alpine"  
          echo "✅ Jekyll Documentation Builder: Ruby 3.2 Alpine"
          echo "✅ Production Runtime: Minimal Node.js 22 Alpine"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Derek Mackley Developer Portfolio
            org.opencontainers.image.description=Multi-builder optimized portfolio with React, Storybook, Jekyll docs
            org.opencontainers.image.vendor=Derek Mackley
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            maintainer=${{ github.actor }}
            build.architecture=multi-stage-parallel
            build.builders=react,storybook,jekyll
            deployment.type=nodejs-express
            deployment.framework=vite-react
            deployment.environment=production
            security.non-root=true
            security.user=nextjs:nodejs

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            NODE_ENV=production
            VITE_SITE_MAIN_URL=https://derekmackley.com
            VITE_SITE_STORYBOOK_URL=https://storybook.derekmackley.com
            VITE_SITE_DOCS_URL=https://docs.derekmackley.com
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "Digest: $digest"

      - name: Generate image metadata
        run: |
          echo "### Developer Portfolio Image Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify image push
        run: |
          echo "Verifying image was pushed successfully..."
          docker manifest inspect ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          echo "✅ Image verified successfully"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Deployment complete
        run: |
          echo "🚀 Deployment completed successfully"
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "All metadata, labels, and attestations applied"
---
layout: default
permalink: /404.html
---

<div class="error-page">
  <div class="error-container">
    <div class="error-code">
      <span class="code-number">404</span>
      <span class="code-text">ACCESS DENIED</span>
    </div>
    
    <div class="error-message">
      <h1 class="error-title">
        <span class="glitch-text" data-text="RESOURCE NOT FOUND">RESOURCE NOT FOUND</span>
      </h1>
      <p class="error-description">
        The requested resource could not be located in the system.
      </p>
    </div>
    
    <div class="terminal-output">
      <div class="terminal-line">
        <span class="prompt">$</span> GET {{ page.url }} HTTP/1.1
      </div>
      <div class="terminal-line error">
        <span class="prompt">></span> Status: 404 Not Found
      </div>
      <div class="terminal-line">
        <span class="prompt">></span> Error: Resource unavailable
      </div>
      <div class="terminal-line">
        <span class="prompt">></span> Suggestion: Return to <a href="{{ '/' | relative_url }}">home directory</a>
      </div>
    </div>
    
    <div class="error-actions">
      <a href="{{ '/' | relative_url }}" class="action-button primary">
        <span class="button-icon">[←]</span>
        Return Home
      </a>
      <a href="javascript:history.back()" class="action-button secondary">
        <span class="button-icon">[↶]</span>
        Go Back
      </a>
    </div>
  </div>
</div>

<style>
.error-page {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.error-container {
  text-align: center;
  max-width: 600px;
  padding: 2em;
}

.error-code {
  margin-bottom: 2em;
}

.code-number {
  font-family: 'Orbitron', sans-serif;
  font-size: 8em;
  font-weight: 900;
  color: #ff0080;
  display: block;
  line-height: 1;
  text-shadow: 
    0 0 20px rgba(255, 0, 128, 0.5),
    0 0 40px rgba(255, 0, 128, 0.3);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.code-text {
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.5em;
  color: #00ff88;
  display: block;
  margin-top: 0.5em;
  letter-spacing: 0.2em;
}

.error-title {
  font-size: 2em;
  margin: 0.5em 0;
}

.glitch-text {
  position: relative;
  color: #00d4ff;
  animation: glitch-animation 3s infinite;
}

.glitch-text:before,
.glitch-text:after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.glitch-text:before {
  animation: glitch-1 0.5s infinite;
  color: #ff0080;
  z-index: -1;
}

.glitch-text:after {
  animation: glitch-2 0.5s infinite;
  color: #00ff88;
  z-index: -2;
}

@keyframes glitch-animation {
  0%, 100% {
    text-shadow: 
      0 0 10px rgba(0, 212, 255, 0.5),
      0 0 20px rgba(0, 212, 255, 0.3);
  }
  50% {
    text-shadow: 
      0 0 10px rgba(255, 0, 128, 0.5),
      0 0 20px rgba(0, 255, 136, 0.3);
  }
}

@keyframes glitch-1 {
  0%, 100% {
    clip: rect(44px, 9999px, 56px, 0);
    transform: translate(0);
  }
  20% {
    clip: rect(20px, 9999px, 40px, 0);
    transform: translate(-2px, -2px);
  }
  40% {
    clip: rect(65px, 9999px, 90px, 0);
    transform: translate(-2px, -2px);
  }
  60% {
    clip: rect(10px, 9999px, 30px, 0);
    transform: translate(2px, 2px);
  }
  80% {
    clip: rect(80px, 9999px, 100px, 0);
    transform: translate(2px, 2px);
  }
}

@keyframes glitch-2 {
  0%, 100% {
    clip: rect(65px, 9999px, 119px, 0);
    transform: translate(0);
  }
  20% {
    clip: rect(40px, 9999px, 60px, 0);
    transform: translate(2px, 2px);
  }
  40% {
    clip: rect(10px, 9999px, 40px, 0);
    transform: translate(2px, 2px);
  }
  60% {
    clip: rect(85px, 9999px, 110px, 0);
    transform: translate(-2px, -2px);
  }
  80% {
    clip: rect(25px, 9999px, 50px, 0);
    transform: translate(-2px, -2px);
  }
}

.error-description {
  color: #888;
  font-size: 1.2em;
  margin: 1em 0 2em;
}

.terminal-output {
  background: #0d1620;
  border: 1px solid #1a2332;
  border-radius: 4px;
  padding: 1.5em;
  text-align: left;
  font-family: 'Share Tech Mono', monospace;
  margin: 2em 0;
  position: relative;
  overflow: hidden;
}

.terminal-output:before {
  content: 'TERMINAL';
  position: absolute;
  top: -1px;
  left: -1px;
  background: #00ff88;
  color: #0a0e1a;
  padding: 2px 10px;
  font-size: 0.8em;
  font-weight: bold;
}

.terminal-line {
  margin: 0.5em 0;
  color: #e0e0e0;
}

.terminal-line.error {
  color: #ff0080;
}

.prompt {
  color: #00ff88;
  margin-right: 0.5em;
}

.terminal-output a {
  color: #00d4ff;
}

.error-actions {
  display: flex;
  gap: 1em;
  justify-content: center;
  margin-top: 2em;
}

.action-button {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.8em 1.5em;
  border: 2px solid;
  border-radius: 4px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 1em;
  text-transform: uppercase;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.action-button:after {
  display: none;
}

.action-button.primary {
  background: rgba(0, 255, 136, 0.1);
  border-color: #00ff88;
  color: #00ff88;
}

.action-button.primary:hover {
  background: rgba(0, 255, 136, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  transform: translateY(-2px);
}

.action-button.secondary {
  background: rgba(0, 212, 255, 0.1);
  border-color: #00d4ff;
  color: #00d4ff;
}

.action-button.secondary:hover {
  background: rgba(0, 212, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
  transform: translateY(-2px);
}

.button-icon {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2em;
}
</style>
